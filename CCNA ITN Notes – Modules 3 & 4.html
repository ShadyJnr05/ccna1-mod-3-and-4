<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#18222d;--mu:#5a6b7d;--ac:#0b78b8;--bd:#d6dfe9;--ok:#1f9d55;--th:#e8f0f8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d141c;--card:#152130;--tx:#e4ecf4;--mu:#93a5b8;--ac:#4cb8f0;--bd:#26384c;--ok:#43c77a;--th:#1c3047;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d141c;--card:#152130;--tx:#e4ecf4;--mu:#93a5b8;--ac:#4cb8f0;--bd:#26384c;--ok:#43c77a;--th:#1c3047;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--bd);z-index:11;padding:.7rem 1rem}
.in{max-width:860px;margin:0 auto}
h1{font-size:1.15rem;margin:0}
.bar{height:6px;background:var(--bd);border-radius:4px;margin:.5rem 0 .3rem;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.row{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;justify-content:space-between}
.pg{color:var(--mu);font-size:.85rem}
button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:.35rem .7rem;font:inherit;font-size:.85rem;cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:860px;margin:0 auto;padding:1rem}
details{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin:.6rem 0}
summary{cursor:pointer;padding:.8rem 1rem;font-weight:600;list-style:none;display:flex;gap:.6rem;align-items:center}
summary::before{content:"▸";color:var(--ac)}
details[open]>summary::before{content:"▾"}

details.done summary .d{display:inline}
.b{padding:0 1rem 1rem}
.b h4{margin:1rem 0 .3rem;color:var(--ac);font-size:.95rem}
.b ul{margin:.3rem 0;padding-left:1.3rem}
.b p{margin:.4rem 0}
.w{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.9rem;margin:.5rem 0}
th,td{border:1px solid var(--bd);padding:.4rem .6rem;text-align:left;vertical-align:top}
th{background:var(--th)}
.tip{border-left:3px solid var(--ac);background:var(--th);padding:.5rem .8rem;border-radius:0 8px 8px 0;margin:.6rem 0;font-size:.92rem}
label.rd{display:flex;gap:.5rem;align-items:center;margin-top:1rem;color:var(--mu);font-size:.9rem;cursor:pointer}
footer{text-align:center;color:var(--mu);font-size:.85rem;padding:1.5rem 1rem 2rem}
@media print{@page{size:A4;margin:14mm}header,label.rd,footer button{display:none}body::before{display:none}details{break-inside:avoid}}
</style></head><body>
<header><div class="in">
<div class="row"><h1>CCNA ITN Notes · Modules 3 &amp; 4</h1>
<div><button id="tm">Theme</button> <button id="ex">Expand all</button></div></div>
<div class="bar"><i id="pb"></i></div>
<div class="row"><span class="pg" id="pt"></span>

</div></header>
<main id="m"></main>
<footer>Modau.M IT</footer>
<script>
const S=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const ul=a=>"<ul>"+a.map(x=>"<li>"+x+"</li>").join("")+"</ul>";
const tb=(h,r)=>'<div class="w"><table><tr>'+h.map(x=>"<th>"+x+"</th>").join("")+"</tr>"+r.map(x=>"<tr>"+x.map(c=>"<td>"+c+"</td>").join("")+"</tr>").join("")+"</table></div>";
const tip=t=>'<div class="tip">'+t+"</div>";
const D=[
{m:3,n:"3.1",t:"The Rules",h:`<h4>Three elements of any communication</h4>`+ul(["<b>Source</b> (sender)","<b>Destination</b> (receiver)","<b>Channel</b> (media) providing the path"])+`<h4>Protocols</h4><p>Protocols are the rules all communication follows. They must account for: an identified sender and receiver, common language and grammar, speed and timing of delivery, and confirmation or acknowledgment requirements.</p><h4>Network protocol requirements</h4>`+tb(["Requirement","Meaning"],[["Message encoding","Converting information into another acceptable form for transmission; decoding reverses it. Messages become bits, then light, sound or electrical impulses"],["Formatting and encapsulation","A message must use a specific format or structure, depending on message type and channel"],["Message size","Long messages are broken into smaller pieces suited to the medium"],["Message timing","<b>Flow control</b>: rate of transmission. <b>Response timeout</b>: how long to wait for a reply. <b>Access method</b>: when a device may send"],["Delivery options","Unicast, multicast, broadcast"]])+`<h4>Collisions</h4><p>A collision happens when more than one device sends at the same time and the messages become corrupt. Some protocols are proactive (prevent collisions); others are reactive (recover after one).</p><h4>Delivery options</h4>`+ul(["<b>Unicast</b>: one to one","<b>Multicast</b>: one to many (typically not all)","<b>Broadcast</b>: one to all"])+tip("Broadcast is used in IPv4 but is not an option in IPv6. IPv6 adds <b>anycast</b>.")},
{m:3,n:"3.2",t:"Protocols",h:`<h4>Protocol types</h4>`+tb(["Type","Description"],[["Network communications","Enable two or more devices to communicate over one or more networks"],["Network security","Secure data: authentication, data integrity, data encryption"],["Routing","Let routers exchange route information, compare paths and select the best path"],["Service discovery","Automatic detection of devices or services"]])+`<p>Protocols can be implemented in software, hardware or both, and each has its own function, format and rules.</p><h4>Protocol functions</h4>`+tb(["Function","Description"],[["Addressing","Identifies sender and receiver"],["Reliability","Provides guaranteed delivery"],["Flow control","Ensures data flows at an efficient rate"],["Sequencing","Uniquely labels each transmitted segment"],["Error detection","Determines if data was corrupted in transit"],["Application interface","Process-to-process communication between network applications"]])+`<h4>Protocol interaction (web example)</h4>`+tb(["Protocol","Function"],[["HTTP","Governs how a web server and web client interact; defines content and format"],["TCP","Manages individual conversations, guaranteed delivery, flow control"],["IP","Delivers messages globally from sender to receiver"],["Ethernet","Delivers messages from one NIC to another on the same LAN"]])},
{m:3,n:"3.3",t:"Protocol Suites",h:ul(["A <b>protocol suite</b> is a group of inter-related protocols needed to perform a communication function. Viewed in layers: higher layers vs lower layers (which move data and serve upper layers)"])+`<h4>Common suites</h4>`+tb(["Suite","Notes"],[["Internet Protocol Suite (TCP/IP)","Most common; maintained by the IETF"],["OSI protocols","Developed by ISO and ITU"],["AppleTalk","Proprietary (Apple)"],["Novell NetWare","Proprietary (Novell)"]])+`<h4>TCP/IP</h4>`+ul(["Used by the internet; operates at the application, transport and internet layers","Common network access LAN protocols: Ethernet and WLAN","<b>Open standard</b>: freely available, usable by any vendor","<b>Standards-based</b>: endorsed by the industry and approved by a standards organization, ensuring interoperability"])+`<p>Communication process: the web server encapsulates and sends a page; the client de-encapsulates it for the browser.</p>`},
{m:3,n:"3.4",t:"Standards Organizations",h:`<p>Open standards encourage <b>interoperability, competition and innovation</b>. Standards organizations are vendor-neutral, non-profit bodies that develop and promote open standards.</p><h4>Internet standards</h4>`+tb(["Body","Role"],[["ISOC","Promotes open development and evolution of the internet"],["IAB","Manages and develops internet standards"],["IETF","Develops, updates and maintains internet and TCP/IP technologies"],["IRTF","Long-term research on internet and TCP/IP"],["ICANN","Coordinates IP address allocation, domain names and other assignments"],["IANA","Oversees IP allocation, domain names and protocol identifiers for ICANN"]])+`<h4>Electronic and communications standards</h4>`+tb(["Body","Role"],[["IEEE","Standards in power, healthcare, telecoms and networking"],["EIA","Electrical wiring, connectors, 19-inch racks"],["TIA","Radio equipment, cell towers, VoIP, satellite"],["ITU-T","Video compression, IPTV, broadband such as DSL"]])},
{m:3,n:"3.5",t:"Reference Models",h:`<p>Two layered models describe network operations: <b>OSI</b> and <b>TCP/IP</b>.</p><h4>Benefits of a layered model</h4>`+ul(["Assists protocol design (defined information and interfaces per layer)","Fosters competition between vendors","Changes in one layer do not affect layers above and below","Provides a common language for networking functions"])+`<h4>OSI model (7 layers)</h4>`+tb(["#","Layer","Description"],[["7","Application","Protocols for process-to-process communication"],["6","Presentation","Common representation of transferred data"],["5","Session","Services to presentation layer; manages data exchange"],["4","Transport","Segment, transfer and reassemble data for each communication"],["3","Network","Exchanges individual pieces of data over the network"],["2","Data Link","Exchanges frames over a common media"],["1","Physical","Activates, maintains and de-activates physical connections"]])+`<h4>TCP/IP model (4 layers)</h4>`+tb(["Layer","Description"],[["Application","Represents data to the user, plus encoding and dialog control"],["Transport","Supports communication between devices across diverse networks"],["Internet","Determines the best path through the network"],["Network Access","Controls the hardware devices and media"]])+tip("OSI splits TCP/IP’s network access layer (into Layers 1 and 2) and application layer (into Layers 5 to 7). TCP/IP does not specify which protocols to use on the physical medium.")},
{m:3,n:"3.6",t:"Data Encapsulation",h:`<h4>Segmenting and sequencing</h4>`+ul(["<b>Segmenting</b>: breaking messages into smaller units. <b>Multiplexing</b>: interleaving multiple segmented streams","Benefits: <b>speed</b> (links not tied up) and <b>efficiency</b> (only failed segments are resent)","<b>Sequencing</b>: numbering segments so the message can be reassembled. TCP does this"])+`<h4>Protocol data units (PDUs)</h4><p>Encapsulation is where protocols add their information to the data. PDU names (TCP/IP) going down the stack:</p><p><b>Data → Segment → Packet → Frame → Bits</b></p>`+ul(["Encapsulation is top-down; each layer does its work and passes down until sent as a bit stream","De-encapsulation goes up: bits → frame → packet → segment → data. Each layer strips its header"])},
{m:3,n:"3.7",t:"Data Access",h:`<h4>Addresses</h4>`+ul(["<b>Network layer (L3)</b>: source and destination IP, delivers the packet from original source to final destination","<b>Data link layer (L2)</b>: source and destination MAC, delivers the frame from one NIC to another on the same network"])+`<h4>Layer 3 logical address</h4>`+ul(["Network portion (IPv4) or prefix (IPv6): left-most part, same across a LAN or WAN","Host portion (IPv4) or interface ID (IPv6): identifies the specific device, unique per device"])+`<h4>Same network</h4><p>Source and destination share the network portion (example: PC1 192.168.1.110, FTP server 192.168.1.9). The frame uses the actual destination MAC, which is physically embedded in the NIC and is local addressing.</p><h4>Different (remote) network</h4>`+ul(["Network portions differ (example: PC1 192.168.1.x, web server 172.16.1.x)","Layer 3 gives Layer 2 the <b>default gateway</b> (router interface IP on the LAN) as the next hop","All LAN devices must know the gateway or traffic stays on the LAN","MAC addressing is per link/hop: PC1 → R1 → R2 → web server, each hop with new source and destination MACs"])+tip("The <b>packet</b> is not modified, the <b>frame</b> changes at every hop. L3 (IP) stays the same end to end; L2 (MAC) changes link by link.")},
{m:4,n:"4.1",t:"Purpose of the Physical Layer",h:ul(["Before any communication, a physical connection (wired or wireless) to a local network must exist","A <b>NIC</b> connects a device to the network; a device may have one or several (wired and/or wireless)","Not all connections offer the same performance","The physical layer <b>transports bits</b> across the media: it accepts a complete frame from the Data Link layer and encodes it as signals","It is the <b>last step of encapsulation</b>. The next device receives the bits, re-encapsulates the frame, then decides what to do"])},
{m:4,n:"4.2",t:"Physical Layer Characteristics",h:`<h4>Standards</h4><p>TCP/IP standards are software, governed by the IETF. Physical layer standards are hardware, governed by ISO, EIA/TIA, ITU-T, ANSI and IEEE.</p><h4>Three functional areas</h4>`+tb(["Area","Description"],[["Physical components","Hardware, media and connectors that carry signals: NICs, interfaces, connectors, cable materials and designs"],["Encoding","Converts the bit stream into a predictable format the next device recognizes. Examples: Manchester, 4B/5B, 8B/10B"],["Signaling","How 1s and 0s are represented on the medium"]])+tb(["Medium","Signal"],[["Copper","Electrical signals"],["Fiber-optic","Light pulses"],["Wireless","Microwave/radio signals (modulation such as AM, FM, PM)"]])+`<h4>Bandwidth</h4><p>Capacity of a medium to carry data; digital bandwidth is bits per second.</p>`+tb(["Unit","Abbr.","Equivalence"],[["Bits per second","bps","fundamental unit"],["Kilobits","Kbps","1,000 bps (10³)"],["Megabits","Mbps","1,000,000 bps (10⁶)"],["Gigabits","Gbps","10⁹ bps"],["Terabits","Tbps","10¹² bps"]])+`<h4>Terminology</h4>`+ul(["<b>Latency</b>: time, including delays, for data to travel between two points","<b>Throughput</b>: transfer of bits across the media over a given time","<b>Goodput</b>: usable data transferred over a given time. Goodput = throughput − traffic overhead"])},
{m:4,n:"4.3",t:"Copper Cabling",h:`<p>The most common cabling: inexpensive, easy to install, low resistance to electrical current.</p>`+tb(["Limitation","Mitigation"],[["<b>Attenuation</b>: signal weakens over distance","Adhere to cable length limits"],["<b>EMI / RFI</b> distort and corrupt signals","Metallic shielding and grounding"],["<b>Crosstalk</b>","Twist opposing circuit pair wires together"]])+`<h4>Types</h4>`+tb(["Type","Key points"],[["<b>UTP</b>","Most common; RJ-45 connectors; outer jacket, twisted pairs, colour-coded insulation. No shielding"],["<b>STP</b>","Better noise protection, more expensive, harder to install; RJ-45. Braided/foil shield plus foil around each pair"],["<b>Coax</b>","Jacket, woven copper braid or foil (second wire and shield), plastic insulation, copper conductor. Connectors: BNC, N type, F type. Used for wireless antennas and cable internet"]])},
{m:4,n:"4.4",t:"UTP Cabling",h:`<p>Four pairs of colour-coded copper wires twisted together in a plastic sheath. To limit crosstalk UTP relies on:</p>`+ul(["<b>Cancellation</b>: each wire in a pair has opposite polarity; twisted, their magnetic fields cancel each other and outside EMI/RFI","<b>Variation in twists per foot</b>: each pair twisted a different amount to prevent crosstalk"])+`<h4>Standards</h4>`+ul(["<b>TIA/EIA-568</b>: cable types, lengths, connectors, termination, testing","<b>IEEE</b> rates electrical performance: Category 3, 5/5e, 6","Connector: RJ-45 plug and socket. Poor termination hurts performance"])+`<h4>Cable types</h4>`+tb(["Cable","Standard","Use"],[["Straight-through","Both ends T568A or both T568B","Host to network device"],["Crossover (legacy: Auto-MDIX)","One end T568A, other T568B","Host-host, switch-switch, router-router"],["Rollover","Cisco proprietary","Host serial port to router/switch console port (adapter)"]])},
{m:4,n:"4.5",t:"Fiber-Optic Cabling",h:ul(["Costs more than UTP, so less common","Longest distances and highest bandwidth of any media; less attenuation; <b>immune to EMI/RFI</b>","Thin strands of pure glass; laser or LED encodes bits as light pulses; cable acts as a wave guide"])+`<h4>Single-mode vs multimode</h4>`+tb(["","Single-mode (SMF)","Multimode (MMF)"],[["Core","Very small (9 µm)","Larger (50/62.5 µm)"],["Cladding","125 µm","125 µm"],["Light source","Expensive lasers","Cheaper LEDs at different angles"],["Use","Long distance","Up to 10 Gbps over 550 m"]])+`<p><b>Dispersion</b> is the spreading of a light pulse over time; more dispersion means more signal loss. MMF has greater dispersion than SMF.</p><h4>Usage</h4>`+ul(["Enterprise networks (backbone)","Fiber-to-the-Home (FTTH)","Long-haul networks","Submarine cable networks"])+`<h4>Connectors and patch cords</h4><p>ST, SC, LC and duplex multimode LC. Patch cords: SC-SC MM, LC-LC SM, ST-LC MM, ST-SC SM.</p>`+tip("Yellow jacket = single-mode. Orange (or aqua) = multimode.")+`<h4>Fiber vs UTP</h4>`+tb(["Issue","UTP","Fiber"],[["Bandwidth","10 Mb/s – 10 Gb/s","10 Mb/s – 100 Gb/s"],["Distance","1 – 100 m","1 – 100,000 m"],["EMI/RFI immunity","Low","High (complete)"],["Electrical hazard immunity","Low","High (complete)"],["Cost, skills, safety","Lowest","Highest"]])},
{m:4,n:"4.6",t:"Wireless Media",h:`<p>Carries electromagnetic signals (radio or microwave frequencies) for binary digits. Greatest mobility.</p><h4>Limitations</h4>`+ul(["<b>Coverage area</b>: affected by the deployment environment","<b>Interference</b>: disrupted by common devices","<b>Security</b>: no physical media access needed, anyone can receive","<b>Shared medium</b>: WLANs are half-duplex; more users, less bandwidth each"])+`<h4>Standards</h4>`+tb(["Standard","IEEE","Purpose"],[["Wi-Fi","802.11","WLAN"],["Bluetooth","802.15","WPAN"],["WiMAX","802.16","Point-to-multipoint broadband wireless"],["Zigbee","802.15.4","Low data rate, low power, IoT"]])+`<p>Physical layer specs cover signal encoding, frequency and power, reception and decoding, and antenna design.</p><h4>WLAN needs</h4>`+ul(["<b>Wireless access point (AP)</b>: concentrates wireless signals and connects to the copper network","<b>Wireless NIC adapters</b> on hosts","Ensure compatibility, and apply strict security policies"])}
];
let f="all";const key="itn34",rd=JSON.parse(S(key)||"{}");
const m=document.getElementById("m");
m.innerHTML=D.map(s=>`<details data-m="${s.m}" data-n="${s.n}"><summary><span class="n">${s.n}</span>${s.t}<span class="d">✓</span></summary><div class="b">${s.h}<label class="rd"><input type="checkbox"> Mark as read</label></div></details>`).join("");
const ds=[...m.querySelectorAll("details")];
function upd(){const t=ds.filter(d=>rd[d.dataset.n]).length;document.getElementById("pb").style.width=(100*t/ds.length)+"%";document.getElementById("pt").textContent=t+" of "+ds.length+" sections read";}
ds.forEach(d=>{const c=d.querySelector("input");c.checked=!!rd[d.dataset.n];d.classList.toggle("done",c.checked);
c.onchange=()=>{rd[d.dataset.n]=c.checked;if(!c.checked)delete rd[d.dataset.n];d.classList.toggle("done",c.checked);S(key,JSON.stringify(rd));upd()}});
upd();
document.getElementById("tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;f=b.dataset.f;
document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));ds.forEach(d=>d.hidden=f!=="all"&&d.dataset.m!==f)};
let open=false;document.getElementById("ex").onclick=function(){open=!open;ds.forEach(d=>d.open=open);this.textContent=open?"Collapse all":"Expand all"};
const R=document.documentElement,tm=document.getElementById("tm");
R.dataset.theme=S("itn34-theme")||"dark";
tm.onclick=()=>{R.dataset.theme=R.dataset.theme==="dark"?"light":"dark";S("itn34-theme",R.dataset.theme)};
</script></body></html>
